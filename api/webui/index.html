<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smart Agent — 内容分析平台</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f5f6f8; --surface: #fff; --surface2: #f8f9fb; --border: #e5e7eb;
  --text: #1a1b23; --text-dim: #6b7280; --accent: #4f6ef6; --accent-hover: #3b5de7;
  --green: #10b981; --red: #ef4444; --yellow: #f59e0b; --radius: 10px;
  --shadow: 0 1px 3px rgba(0,0,0,.06);
}
[data-theme="dark"] {
  --bg: #111318; --surface: #1a1d24; --surface2: #22252d; --border: #2d3039;
  --text: #e5e7eb; --text-dim: #9ca3af; --accent: #6d8af6; --accent-hover: #8da3f8;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
}
[data-theme="dark"] .history-item:hover { background: #1e2230; }
[data-theme="dark"] .history-item .hi-delete:hover { background: #3d1a1a; }
[data-theme="dark"] .result-table th { background: var(--surface2); }
[data-theme="dark"] .btn-sm { background: var(--surface2); border-color: var(--border); color: var(--text); }
[data-theme="dark"] .btn-sm:hover { border-color: var(--accent); }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  display: flex; flex-direction: column; min-height: 100vh;
}
header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 12px 28px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
}
header h1 { font-size: 18px; font-weight: 700; }
header .badge { background: var(--accent); color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
header .conn-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-left: auto; }
header .conn-dot.on { background: var(--green); }

/* Tabs */
#tab-bar { display: flex; gap: 0; flex-shrink: 0; padding: 0 28px; background: var(--surface); border-bottom: 1px solid var(--border); }
.tab-btn { background: none; border: none; color: var(--text-dim); padding: 10px 20px; font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s; font-family: inherit; }
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

main { flex: 1; display: flex; flex-direction: column; padding: 20px 28px; gap: 16px; overflow-y: auto; }
.tab-content { display: none; flex-direction: column; gap: 16px; }
.tab-content.active { display: flex; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
.card h2 { font-size: 13px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 14px; }

/* Controls */
.control-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.control-group { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.control-group label { font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }
.control-group select, .control-group input {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
  color: var(--text); padding: 8px 10px; font-size: 13px; font-family: inherit; outline: none;
}
.control-group select:focus, .control-group input:focus { border-color: var(--accent); }
#keyword, #pl-keyword { flex: 1; min-width: 140px; }
#limit, #pl-limit { width: 60px; text-align: center; }

.platform-checks { display: flex; flex-wrap: wrap; gap: 6px; }
.platform-checks label { display: flex; align-items: center; gap: 4px; font-size: 12px; cursor: pointer; padding: 5px 12px; border-radius: 20px; background: var(--surface2); border: 1px solid var(--border); user-select: none; }
.platform-checks label:hover { border-color: var(--accent); }
.platform-checks label.checked { border-color: var(--accent); background: #eef1ff; color: var(--accent); font-weight: 600; }
.platform-checks input[type=checkbox] { accent-color: var(--accent); }

.mode-radios { display: flex; gap: 14px; }
.mode-radios label { font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
.mode-radios input[type=radio] { accent-color: var(--accent); }

.btn-primary {
  background: var(--accent); color: #fff; border: none; border-radius: 6px;
  padding: 8px 20px; font-size: 13px; font-weight: 600; cursor: pointer;
  height: 37px; display: flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; }
.spinner { display: none; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.btn-primary.loading .spinner { display: inline-block; }

.btn-sm {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  border-radius: 5px; padding: 4px 12px; font-size: 11px; cursor: pointer;
  font-family: inherit; white-space: nowrap;
}
.btn-sm:hover { border-color: var(--accent); }
.btn-sm:disabled { opacity: .3; cursor: not-allowed; }

/* Progress */
.progress-bar { display: none; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); padding: 8px 0; }
.progress-bar.visible { display: flex; }
.progress-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

/* Results Table */
.result-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.result-table th { text-align: left; padding: 8px 12px; border-bottom: 2px solid var(--border); font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .3px; font-weight: 600; white-space: nowrap; }
.result-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.result-table tbody tr { transition: background .1s; }
.result-table tbody tr:hover { background: var(--surface2); }
.result-table .col-platform { width: 70px; }
.result-table .col-count { width: 80px; text-align: right; }
.result-table .col-title { min-width: 180px; }
.result-table .col-author { width: 100px; color: var(--text-dim); font-size: 12px; }
.result-table .col-link { width: 50px; text-align: center; }
.result-table a { color: var(--accent); text-decoration: none; font-size: 11px; }
.result-table a:hover { text-decoration: underline; }
.platform-tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.platform-tag.bilibili { background: #fde8ef; color: #e0437c; }
.platform-tag.xiaohongshu { background: #fde8e8; color: #e04343; }
.platform-tag.douyin { background: #e8e8e8; color: #333; }
.platform-tag.zhihu { background: #e3edfd; color: #1a6de0; }
.platform-tag.kuaishou { background: #fef3e4; color: #e07a1a; }
.platform-tag.weibo { background: #fde8e8; color: #e04343; }
.platform-tag.tieba { background: #e8f5e9; color: #2e7d32; }

/* Agent Reports */
#agent-reports { display: none; }
#agent-reports.visible { display: flex; flex-direction: column; }
#agent-cards { display: flex; flex-direction: column; gap: 10px; }
.agent-card {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  padding: 16px 20px; border-left: 4px solid var(--accent);
}
.agent-card .agent-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.agent-card .agent-icon { font-size: 22px; }
.agent-card .agent-name { font-size: 15px; font-weight: 700; }
.agent-card .agent-summary { font-size: 14px; color: var(--text); line-height: 1.7; }
.agent-card .agent-detail { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-dim); line-height: 1.6; }
.agent-card .detail-item { margin-bottom: 5px; padding-left: 10px; border-left: 2px solid var(--border); }
.agent-card .detail-score { font-weight: 700; font-size: 12px; }

/* Stats bar */
.stats-bar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
.stat-item { background: var(--surface2); border-radius: 6px; padding: 8px 14px; font-size: 12px; }
.stat-item strong { color: var(--accent); font-size: 16px; }

/* Log */
.log-container { font-size: 11px; color: var(--text-dim); line-height: 1.6; max-height: 150px; overflow-y: auto; font-family: 'SF Mono','Consolas',monospace; }
.log-container .log-warn { color: var(--yellow); }
.log-container .log-err { color: var(--red); }
.log-container .log-ok { color: var(--green); }

.empty-state { text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 14px; }
.empty-state .empty-icon { font-size: 40px; margin-bottom: 10px; }

/* Filter */
.hidden { display: none !important; }
#filter-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
#filter-text { flex: 1; min-width: 120px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; background: var(--surface2); color: var(--text); font-family: inherit; }
#filter-platform { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; background: var(--surface2); color: var(--text); }
#filter-text:focus, #filter-platform:focus { border-color: var(--accent); outline: none; }
.result-table th.sortable { cursor: pointer; user-select: none; }
.result-table th.sortable:hover { color: var(--accent); }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 1000; align-items: center; justify-content: center; }
.modal-overlay.active { display: flex; }
.modal-box { background: var(--surface); border-radius: var(--radius); max-width: 640px; width: 90%; max-height: 80vh; overflow-y: auto; padding: 24px; position: relative; box-shadow: 0 8px 32px rgba(0,0,0,.15); }
.modal-close { position: absolute; top: 12px; right: 16px; background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-dim); line-height: 1; }
.modal-close:hover { color: var(--text); }
.modal-field { margin-bottom: 10px; }
.modal-field-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; font-weight: 600; letter-spacing: .3px; }
.modal-field-value { font-size: 13px; color: var(--text); margin-top: 2px; word-break: break-all; }
.modal-cover { max-width: 100%; max-height: 240px; border-radius: 6px; margin-bottom: 12px; display: block; }
.result-table tbody tr { cursor: pointer; }

/* Pagination */
.pagination { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px 0; }
.pagination span { font-size: 13px; color: var(--text-dim); }

/* History */
.history-list { display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow-y: auto; }
.history-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 6px; background: var(--surface2); border: 1px solid var(--border); cursor: pointer; transition: background .1s; }
.history-item:hover { border-color: var(--accent); background: #eef1ff; }
.history-item .hi-keyword { font-weight: 600; font-size: 13px; white-space: nowrap; }
.history-item .hi-meta { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
.history-item .hi-delete { margin-left: auto; background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 4px; }
.history-item .hi-delete:hover { color: var(--red); background: #fde8e8; }

@media (max-width: 700px) {
  header { padding: 10px 14px; }
  main { padding: 12px 14px; gap: 10px; }
  .control-row { flex-direction: column; gap: 8px; }
  #keyword, #pl-keyword { min-width: unset; }
  .btn-primary { width: 100%; justify-content: center; }
  .result-table { font-size: 11px; }
  .result-table th, .result-table td { padding: 6px 8px; }
  .col-author, .col-link { display: none; }
  #agent-cards { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
  <h1>Smart Agent</h1>
  <span class="badge">内容分析</span>
  <button id="theme-toggle" title="切换深色/浅色模式" style="background:none;border:none;font-size:20px;cursor:pointer;padding:2px 6px;border-radius:6px;margin-left:auto;margin-right:8px">🌙</button>
  <span class="conn-dot off" id="conn-dot" title="连接状态"></span>
</header>

<div id="tab-bar">
  <button class="tab-btn active" data-tab="crawl">多平台采集</button>
  <button class="tab-btn" data-tab="pipeline">全流程分析</button>
</div>

<main>
<!-- ═══════════ CRAWL TAB ═══════════ -->
<div class="tab-content active" id="tab-crawl">
  <div class="card">
    <h2>采集设置</h2>
    <div class="control-row" style="margin-bottom:8px">
      <div class="control-group" style="width:100%"><label>目标平台</label><div class="platform-checks" id="crawl-platforms"></div></div>
    </div>
    <div class="control-row">
      <div class="control-group"><label>类型</label><select id="type"><option value="search">搜索</option><option value="hot">热榜</option><option value="detail">详情</option><option value="comment">评论</option><option value="user">用户</option></select></div>
      <div class="control-group" style="flex:1;min-width:140px"><label id="keyword-label">关键词</label><input id="keyword" type="text" placeholder="输入搜索关键词…"></div>
      <div class="control-group"><label>数量</label><input id="limit" type="number" value="20" min="1" max="500"></div>
      <button class="btn-primary" id="crawl-btn"><span class="spinner"></span><span>开始采集</span></button>
    </div>
  </div>
  <div class="card" id="history-card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <h2 style="margin:0">搜索历史</h2>
      <button class="btn-sm" id="clear-history">清空</button>
    </div>
    <div class="history-list" id="history-list">
      <div class="empty-state" style="padding:12px;font-size:12px">暂无搜索历史</div>
    </div>
  </div>
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <h2 style="margin:0">采集结果 <span style="font-weight:400;font-size:12px;color:var(--text-dim)" id="results-note">尚未采集</span></h2>
      <div style="display:flex;gap:6px">
        <button class="btn-sm" id="dl-json" disabled>导出 JSON</button>
        <button class="btn-sm" id="dl-csv" disabled>导出 CSV</button>
      </div>
    </div>
    <div id="filter-bar" class="hidden">
      <input id="filter-text" type="text" placeholder="筛选标题/作者…">
      <select id="filter-platform"><option value="">全部平台</option></select>
    </div>
    <div id="results-area">
      <div class="empty-state"><div class="empty-icon">📋</div>选择平台和关键词，点击「开始采集」</div>
    </div>
  </div>
  <div class="card">
    <h2>运行日志</h2>
    <div class="log-container" id="log-container"><span class="log-warn">等待操作…</span></div>
  </div>
</div>

<!-- ═══════════ PIPELINE TAB ═══════════ -->
<div class="tab-content" id="tab-pipeline">
  <div class="card">
    <h2>分析设置</h2>
    <div class="control-row" style="margin-bottom:8px">
      <div class="control-group" style="width:100%">
        <label>分析模式</label>
        <div class="mode-radios">
          <label><input type="radio" name="pl-analysis-mode" value="keyword" checked> 关键词分析</label>
          <label><input type="radio" name="pl-analysis-mode" value="account"> 对标账号（基础）</label>
          <label><input type="radio" name="pl-analysis-mode" value="account_deep"> 深度对标（下载+分析）</label>
          <label><input type="radio" name="pl-analysis-mode" value="sentiment"> 舆情分析（评论采集）</label>
        </div>
      </div>
    </div>
    <div class="control-row" style="margin-bottom:8px">
      <div class="control-group" style="flex:1;min-width:200px"><label id="pl-input-label">分析关键词</label><input id="pl-keyword" type="text" placeholder="输入要分析的关键词…"></div>
      <div class="control-group"><label>每平台数量</label><input id="pl-limit" type="number" value="10" min="1" max="100"></div>
    </div>
    <div class="control-row" style="margin-bottom:8px">
      <div class="control-group" style="width:100%"><label>目标平台</label><div class="platform-checks" id="pl-platforms"></div></div>
    </div>
    <div class="control-row">
      <div class="control-group">
        <label>分析深度</label>
        <div class="mode-radios">
          <label><input type="radio" name="pl-mode" value="full" checked> 深度分析（7 个 AI Agent）</label>
          <label><input type="radio" name="pl-mode" value="download"> 采集+下载（搜索→下载视频/封面）</label>
          <label><input type="radio" name="pl-mode" value="simple"> 快速搜索（仅采集）</label>
        </div>
      </div>
      <button class="btn-primary" id="pl-btn"><span class="spinner"></span><span>开始分析</span></button>
    </div>
    <div class="progress-bar" id="pl-progress"><span class="progress-dot"></span><span id="pl-progress-text"></span></div>
  </div>

  <!-- Agent Reports — 放在最上面，最先睇到 -->
  <div id="agent-reports" class="card">
    <h2>AI 分析报告</h2>
    <div id="agent-cards"></div>
  </div>

  <!-- Stats + Results Table -->
  <div id="stats-card" class="card" style="display:none">
    <div class="stats-bar" id="stats-bar"></div>
  </div>
  <div class="card" id="history-card-pl">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <h2 style="margin:0">分析历史</h2>
      <button class="btn-sm" id="clear-history-pl">清空</button>
    </div>
    <div class="history-list" id="history-list-pl">
      <div class="empty-state" style="padding:12px;font-size:12px">暂无分析历史</div>
    </div>
  </div>
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <h2 style="margin:0">搜索结果 <span style="font-weight:400;font-size:12px;color:var(--text-dim)" id="results-note-pl">尚未分析</span></h2>
      <div style="display:flex;gap:6px">
        <button class="btn-sm" id="dl-json-pl" disabled>导出 JSON</button>
        <button class="btn-sm" id="dl-csv-pl" disabled>导出 CSV</button>
      </div>
    </div>
    <div id="results-area-pl">
      <div class="empty-state"><div class="empty-icon">🔍</div>输入关键词，选择平台，点击「开始分析」</div>
    </div>
  </div>

  <!-- Log -->
  <div class="card">
    <h2>运行日志</h2>
    <div class="log-container" id="log-container-pl"><span class="log-warn">等待分析…</span></div>
  </div>
</div>
</main>

<!-- Detail Modal -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal-box">
    <button class="modal-close" id="modal-close">&times;</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
function fmtTime() { const d = new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0'); }

// ─── State ────────────────────────────────────────
let platforms = [], lastResults = null, lastPipeline = null, ws = null, pollTimer = null;
let _allItems = [], _filteredItems = [], currentPage = 0, pageSize = 50;
let sortKey = null, sortDir = 'asc';
let _currentKeyword = '', _currentPlatforms = [];
const typeLabels = { search:'搜索', hot:'热榜', rank:'排行榜', detail:'详情', user:'用户' };
const platformHotLabels = { bilibili:'排行榜', douyin:'热搜关键词', xiaohongshu:'推荐热门', zhihu:'热榜问题', kuaishou:'热播视频', weibo:'热搜话题', tieba:'热门帖子' };
function getHotLabel(platformId) { return platformHotLabels[platformId] || '热榜'; }

// ─── Theme ────────────────────────────────────────
(function(){
  const saved=localStorage.getItem('theme')||'light';
  document.documentElement.setAttribute('data-theme',saved);
  const btn=$('theme-toggle'); if(btn)btn.textContent=saved==='dark'?'☀️':'🌙';
  $('theme-toggle').addEventListener('click',()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const next=cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    localStorage.setItem('theme',next);
    $('theme-toggle').textContent=next==='dark'?'☀️':'🌙';
  });
})();

// ─── Helpers ──────────────────────────────────────
function fmtCount(v) {
  if (v == null || v === '') return '—';
  let n = parseInt(String(v).replace(/[,，]/g,''), 10);
  if (isNaN(n)) return String(v);
  if (n >= 100000000) return (n/100000000).toFixed(1)+'亿';
  if (n >= 10000) return (n/10000).toFixed(1)+'万';
  return n.toLocaleString();
}

function platformTag(p) {
  return `<span class="platform-tag ${p}">${({bilibili:'B站',xiaohongshu:'小红书',douyin:'抖音',zhihu:'知乎',kuaishou:'快手',weibo:'微博',tieba:'贴吧'})[p]||p}</span>`;
}

// ─── Log ─────────────────────────────────────────
function addLog(id, msg, cls) {
  const c = $(id), t = fmtTime();
  c.innerHTML += `<div>[${t}] <span class="log-${cls||''}">${msg.replace(/</g,'&lt;')}</span></div>`;
  while (c.children.length > 200) c.removeChild(c.firstChild);
  c.scrollTop = c.scrollHeight;
}

// ─── WebSocket ────────────────────────────────────
function connectWs() {
  if (ws && ws.readyState===WebSocket.OPEN) return;
  try {
    ws = new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/api/ws');
    ws.onopen = () => { $('conn-dot').className='conn-dot on'; };
    ws.onmessage = (e) => {
      try { const d=JSON.parse(e.data); if(d.type!=='ping') { addLog('log-container',d.message||'',d.level==='ERROR'?'err':d.level==='WARNING'?'warn':''); addLog('log-container-pl',d.message||'',d.level==='ERROR'?'err':d.level==='WARNING'?'warn':''); } } catch(_){}
    };
    ws.onclose = () => { $('conn-dot').className='conn-dot off'; ws=null; setTimeout(connectWs,10000); };
    ws.onerror = () => { if(ws){ws.close();ws=null;} };
  } catch(_){}
}

async function startCrawl() {
  const plats = Array.from($('crawl-platforms').querySelectorAll('input[type=checkbox]:checked')).map(cb=>cb.value);
  const type=$('type').value, keyword=$('keyword').value.trim(), limit=parseInt($('limit').value)||20;
  if(!keyword && (type==='search'||type==='detail'||type==='comment'||type==='user')){const hints={search:'关键词',detail:'视频/帖子ID',comment:'视频/帖子ID',user:'用户ID'};addLog('log-container','请输入'+((hints)[type]||'关键词'),'warn');return;}
  if(!plats.length){addLog('log-container','请至少选择一个平台','warn');return;}
  _currentKeyword=keyword; _currentPlatforms=[...plats];
  const btn=$('crawl-btn'); btn.classList.add('loading'); btn.disabled=true;
  $('dl-json').disabled=true; $('dl-csv').disabled=true; lastResults=null; _allItems=[];
  $('filter-bar').classList.add('hidden');
  $('results-area').innerHTML='<div class="empty-state"><div class="empty-icon">⏳</div>采集中…</div>';
  try {
    const body={type,keyword,limit,platforms:plats};
    if(plats.length===1) body.platform=plats[0];
    const res=await fetch('/api/crawl',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data=await res.json();
    if(data.task_id){addLog('log-container','任务 '+data.task_id.slice(0,8)+' 已启动 ('+plats.length+' 平台)','');pollCrawl(data.task_id);}
    else{handleCrawlResult(data);}
  } catch(e){addLog('log-container','提交失败: '+e.message,'err');finishCrawl();}
}
async function pollCrawl(taskId) {
  try {
    const res=await fetch('/api/crawl/'+taskId);
    const data=await res.json();
    if(data.status==='done') {
      if(data.result){
        if(data.result.items) lastResults=data.result.items;
        else if(data.result.search_results){lastResults=Object.values(data.result.search_results).flat().filter(it=>!it.error);}
        else if(Array.isArray(data.result)) lastResults=data.result;
        else lastResults=[];
      }
      const hotLabel = type==='hot'&&plats.length===1 ? getHotLabel(plats[0]) : typeLabels[type]||type;
      $('results-note').textContent = plats.length===1 ? hotLabel : (plats.length+' 平台');
      renderResults(lastResults,'results-area','results-note');
      if(lastResults.length) saveToHistory(_currentKeyword,_currentPlatforms,lastResults.length,lastResults);
      addLog('log-container','采集完成: '+lastResults.length+' 条','ok');finishCrawl();
    } else if(data.status==='error'){addLog('log-container','任务失败: '+(data.error||'未知'),'err');finishCrawl();}
    else{pollTimer=setTimeout(()=>pollCrawl(taskId),2000);}
  } catch(e){addLog('log-container','轮询失败: '+e.message,'err');pollTimer=setTimeout(()=>pollCrawl(taskId),2000);}
}
function handleCrawlResult(data) {
  if(data.result){
    if(data.result.items) lastResults=data.result.items;
    else if(Array.isArray(data.result)) lastResults=data.result;
    else lastResults=[data.result];
  } else if(Array.isArray(data)) lastResults=data;
  else if(data.data) lastResults=data.data;
  else if(data.items) lastResults=data.items;
  else lastResults=[data];
  renderResults(lastResults,'results-area','results-note');
  if(lastResults.length) saveToHistory(_currentKeyword,_currentPlatforms,lastResults.length,lastResults);
  addLog('log-container','采集完成: '+lastResults.length+' 条','ok');
  finishCrawl();
}
function finishCrawl() {
  const btn=$('crawl-btn'); btn.classList.remove('loading'); btn.disabled=false;
  if(pollTimer){clearTimeout(pollTimer);pollTimer=null;}
}

function saveToHistory(keyword, platforms, count, items) {
  let history = JSON.parse(localStorage.getItem("crawl_history")||"[]");
  history.unshift({keyword, platforms, count, time: new Date().toISOString(), items});
  if(history.length > 20) history = history.slice(0, 20);
  localStorage.setItem("crawl_history", JSON.stringify(history));
  renderHistory();
}
function loadHistory() { return JSON.parse(localStorage.getItem("crawl_history")||"[]"); }
function renderHistory() {
  const history = loadHistory();
  const container = $("history-list");
  if(!history.length) { container.innerHTML = "<div class=\"empty-state\" style=\"padding:12px;font-size:12px\">暂无搜索历史</div>"; return; }
  container.innerHTML = history.map((h, i) => {
    const dt = new Date(h.time);
    const timeStr = (dt.getMonth()+1)+"/"+dt.getDate()+" "+String(dt.getHours()).padStart(2,"0")+":"+String(dt.getMinutes()).padStart(2,"0");
    const names = {bilibili:"B站",xiaohongshu:"小红书",douyin:"抖音",zhihu:"知乎",kuaishou:"快手",weibo:"微博",tieba:"贴吧"};
    const platNames = h.platforms.map(p => names[p]||p).join(" ");
    return "<div class=\"history-item\" onclick=\"window.viewHistory("+i+")\">"+
      "<span class=\"hi-keyword\">"+String(h.keyword).replace(/</g,"&lt;")+"</span>"+
      "<span class=\"hi-meta\">"+platNames+" · "+timeStr+" · "+h.count+"条</span>"+
      "<button class=\"hi-delete\" onclick=\"event.stopPropagation();window.deleteHistory("+i+")\">&times;</button>"+
      "</div>";
  }).join("");
}
window.viewHistory = function(idx) {
  const history = loadHistory(), entry = history[idx];
  if(!entry) return;
  renderResults(entry.items, "results-area", "results-note");
  addLog("log-container", "已加载历史: "+entry.keyword+" ("+entry.count+"条)", "ok");
};
window.deleteHistory = function(idx) {
  let history = loadHistory();
  history.splice(idx, 1);
  localStorage.setItem("crawl_history", JSON.stringify(history));
  renderHistory();
};

async function startPipeline() {
  const keyword=$('pl-keyword').value.trim();
  const plats=Array.from($('pl-platforms').querySelectorAll('input[type=checkbox]:checked')).map(cb=>cb.value);
  const mode=document.querySelector('input[name="pl-mode"]:checked')?.value||'full';
  const analysisMode=document.querySelector('input[name="pl-analysis-mode"]:checked')?.value||'keyword';
  const limit=parseInt($('pl-limit').value)||10;
  const labels={account:'对标账号', account_deep:'深度对标', sentiment:'舆情分析', keyword:'分析关键词'};
  const modeLabel=labels[analysisMode]||'分析关键词';
  if(!keyword){addLog('log-container-pl','请输入'+modeLabel,'warn');return;}
  if(!plats.length){addLog('log-container-pl','请至少选择一个平台','warn');return;}
  const btn=$('pl-btn'); btn.classList.add('loading'); btn.disabled=true;
  $('dl-json-pl').disabled=true; $('dl-csv-pl').disabled=true; lastPipeline=null;
  $('agent-reports').classList.remove('visible'); $('agent-cards').innerHTML='';
  $('stats-card').style.display='none'; $('results-area-pl').innerHTML='<div class="empty-state"><div class="empty-icon">⏳</div>分析中…</div>';
  let effectiveMode=mode;
  if(analysisMode==='account_deep') effectiveMode='full';
  if(analysisMode==='sentiment') effectiveMode='sentiment';
  const descs={full:'深度分析', simple:'快速搜索', download:'采集下载', sentiment:'舆情采集'};
  const taskDesc=analysisMode!=='keyword'?modeLabel+' ':'';
  $('pl-progress').classList.add('visible'); $('pl-progress-text').textContent='正在提交任务 ('+plats.length+' 个平台, '+(descs[effectiveMode]||effectiveMode)+')…';
  addLog('log-container-pl','启动'+taskDesc+'分析: '+keyword+' ['+plats.join(',')+'] '+effectiveMode,'');
  try {
    const res=await fetch('/api/pipeline',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keyword,platforms:plats,limit,pipeline_mode:effectiveMode,analysis_mode:analysisMode})});
    const data=await res.json();
    if(data.task_id){addLog('log-container-pl','任务 '+data.task_id.slice(0,8)+' 已启动','');pollPipeline(data.task_id);}
    else{handlePipelineResult(data);}
  } catch(e){addLog('log-container-pl','提交失败: '+e.message,'err');finishPipeline();}
}
async function pollPipeline(taskId) {
  try {
    const data=await(await fetch('/api/pipeline/'+taskId)).json();
    if(data.status==='done'||data.status==='completed'){addLog('log-container-pl','分析完成!','ok');handlePipelineResult(data.result||data);return;}
    if(data.status==='failed'||data.status==='error'){addLog('log-container-pl','分析失败: '+(data.error||'未知'),'err');finishPipeline();return;}
    $('pl-progress-text').textContent='分析中… ('+data.status+')';
    pollTimer=setTimeout(()=>pollPipeline(taskId),2000);
  } catch(e){addLog('log-container-pl','轮询失败','err');pollTimer=setTimeout(()=>pollPipeline(taskId),2000);}
}
function handlePipelineResult(result) {
  if(!result){finishPipeline();return;}
  lastPipeline=result;
  const full=result.full_result||result;
  const items=full.final_output||[];

  // Stats bar
  const count=items.length;
  let statsHTML=`<div class="stat-item">搜索结果 <strong>${count}</strong> 条</div>`;
  if(result.search_count!==undefined) statsHTML=`<div class="stat-item">搜索结果 <strong>${result.search_count}</strong> 条</div>`+statsHTML.slice(0,0);

  // 下载结果
  const dlResults=full.download_results||result.download_results||[];
  if(dlResults.length>0){
    statsHTML+=`<div class="stat-item">已下载 <strong>${dlResults.length}</strong> 个文件</div>`;
    // 在结果区前展示下载列表
    const dlArea=document.createElement('div');
    dlArea.className='download-list';
    dlArea.innerHTML='<strong>📥 下载文件:</strong><br>'+dlResults.map(f=>{
      const name=f.split(/[\\/]/).pop();
      return `<span style="font-size:12px;color:#10b981">✔ ${name}</span>`;
    }).join('<br>');
    const resultsArea=$('results-area-pl');
    if(resultsArea&&resultsArea.parentNode){
      resultsArea.parentNode.insertBefore(dlArea,resultsArea);
    }
  }

  $('stats-bar').innerHTML=statsHTML;
  $('stats-card').style.display='block';

  // Results table
  if(items.length) renderResults(items,'results-area-pl','results-note-pl');

  // Save to pipeline history
  const kw = $('pl-keyword').value.trim() || result.keyword || '';
  const plats = Array.from($('pl-platforms').querySelectorAll('input[type=checkbox]:checked')).map(cb=>cb.value);
  if(kw && items.length) savePipelineHistory(kw, plats.length?plats:(result.platforms||[]), items.length, full.pipeline_mode||'simple', full);

  // Agent reports — 清晰文字报告，唔系 JSON
  const agents=[
    {key:'trend',name:'爆款识别',icon:'🔥',summary:result.trend_summary,color:'#e0437c'},
    {key:'product',name:'选品分析',icon:'📦',summary:result.product_summary,color:'#e07a1a'},
    {key:'video',name:'视频拆解',icon:'🎬',summary:result.video_summary,color:'#4f6ef6'},
    {key:'sentiment',name:'评论情绪',icon:'💬',summary:result.sentiment_summary,color:'#10b981'},
    {key:'copy',name:'营销文案',icon:'✍️',summary:result.copy_summary,color:'#8b5cf6'},
    {key:'remix',name:'内容改写',icon:'🔄',summary:result.remix_summary,color:'#f59e0b'},
    {key:'visual',name:'配图策略',icon:'🖼️',summary:result.visual_summary,color:'#06b6d4'},
  ];

  let cardsHTML='';
  agents.forEach(a=>{
    if(!a.summary) return;
    const fullKey=a.key+'_report';
    const fullData=full[fullKey]||result[fullKey]||{};
    const itemsArr=fullData.items||[];

    let detailHTML='';
    if(itemsArr.length){
      itemsArr.slice(0,8).forEach(it=>{
        const label=it.title||it.name||it.scene||it.topic||it.variant||it.target_platform||'';
        let desc='';
        // 按 Agent 类型选取最合适的描述字段
        if(a.key==='copy'){
          desc=[it.hook?'钩子: '+it.hook:'', it.cta?'CTA: '+it.cta:'', it.tone?'语气: '+it.tone:''].filter(Boolean).join(' | ');
          if(it.text) desc=(desc?desc+'<br>':'')+String(it.text).substring(0,200);
        }else if(a.key==='remix'){
          desc=it.recommended_angles||it.competition_level||it.entry_barrier||it.key_insights||it.changes_summary||'';
          if(it.rewritten) desc=(desc?desc+'<br>':'')+'改写: '+String(it.rewritten).substring(0,150);
        }else if(a.key==='visual'){
          desc=[it.style?'风格: '+it.style:'', it.color_palette?'配色: '+it.color_palette:'', it.composition?'构图: '+it.composition:'', it.rationale?'理由: '+it.rationale:''].filter(Boolean).join(' | ');
          if(it.prompt) desc=(desc?desc+'<br>':'')+'Prompt: '+String(it.prompt).substring(0,200);
        }else{
          desc=it.trend_reason||it.competitive_advantage||it.structure_template||it.key_insights||it.text||it.learnings||it.audience_reaction||'';
        }
        const score=it.viral_score||it.hook_effectiveness||it.monetization_potential||it.positive_pct||it.opportunity_score;
        if(label||desc){
          detailHTML+='<div class="detail-item">';
          if(label) detailHTML+='<strong>'+String(label).replace(/</g,'&lt;').substring(0,80)+'</strong>';
          if(score!==undefined) detailHTML+=' <span class="detail-score" style="color:'+a.color+'">'+score+'分</span>';
          if(desc) detailHTML+='<div>'+String(desc).replace(/</g,'&lt;').substring(0,400)+'</div>';
          detailHTML+='</div>';
        }
      });
    }
    // 显示额外顶层字段 (recommendations, visual_trend 等)
    const extraFields={remix:['recommendations'], visual:['visual_trend']};
    (extraFields[a.key]||[]).forEach(f=>{
      if(fullData[f]) detailHTML+='<div class="detail-item"><strong>'+f+'</strong><div>'+String(fullData[f]).replace(/</g,'&lt;').substring(0,300)+'</div></div>';
    });

    cardsHTML+='<div class="agent-card" style="border-left-color:'+a.color+'">'+
      '<div class="agent-header"><span class="agent-icon">'+a.icon+'</span><span class="agent-name">'+a.name+'</span></div>'+
      '<div class="agent-summary">'+String(a.summary).replace(/</g,'&lt;')+'</div>'+
      (detailHTML?'<div class="agent-detail">'+detailHTML+'</div>':'')+
    '</div>';
  });

  if(cardsHTML){$('agent-cards').innerHTML=cardsHTML;$('agent-reports').classList.add('visible');}
  else{$('agent-cards').innerHTML='<div class="empty-state" style="padding:20px">分析完成，暂未生成详细报告</div>';$('agent-reports').classList.add('visible');}

  addLog('log-container-pl','分析完成: '+items.length+' 条结果, '+$('agent-cards').children.length+' 份报告','ok');
  finishPipeline();
}
function finishPipeline() {
  const btn=$('pl-btn'); btn.classList.remove('loading'); btn.disabled=false;
  $('pl-progress').classList.remove('visible');
  if(pollTimer){clearTimeout(pollTimer);pollTimer=null;}
}

window.setSort = function(key) {
  if(sortKey===key) sortDir=sortDir==='asc'?'desc':'asc';
  else{sortKey=key;sortDir='asc';}
  applyFilters();
};
function debounce(fn,ms){let t;return(...args)=>{clearTimeout(t);t=setTimeout(()=>fn(...args),ms);};}
function applyFilters(){
  const text=($('filter-text')?.value||'').toLowerCase();
  const plat=$('filter-platform')?.value||'';
  let items=[..._allItems];
  if(text) items=items.filter(it=>(it.title||'').toLowerCase().includes(text)||(it.author||'').toLowerCase().includes(text));
  if(plat) items=items.filter(it=>it.platform===plat);
  if(sortKey){
    items.sort((a,b)=>{
      const va=a[sortKey]||'', vb=b[sortKey]||'';
      const na=parseFloat(String(va).replace(/[,，万]/g,''));
      const nb=parseFloat(String(vb).replace(/[,，万]/g,''));
      if(!isNaN(na)&&!isNaN(nb)) return (na-nb)*(sortDir==='asc'?1:-1);
      return String(va).localeCompare(String(vb))*(sortDir==='asc'?1:-1);
    });
  }
  _filteredItems=items; currentPage=0;
  renderFilteredResults();
}
window.changePage = function(dir){
  const totalPages=Math.ceil(_filteredItems.length/pageSize)||1;
  currentPage=Math.max(0,Math.min(currentPage+dir,totalPages-1));
  renderFilteredResults();
};

// ═══════════ RESULTS TABLE ═══════════
let _currentAreaId='results-area', _currentNoteId='results-note';
function renderResults(items, areaId, noteId) {
  _allItems=items; window._allItems=items; _filteredItems=[...items]; currentPage=0; sortKey=null; sortDir='asc';
  _currentAreaId=areaId; _currentNoteId=noteId;
  if(!items||!items.length){$('filter-bar').classList.add('hidden');$(areaId).innerHTML='<div class="empty-state"><div class="empty-icon">📭</div>无结果</div>';if(noteId)$(noteId).textContent='0 条';return;}
  $('filter-bar').classList.remove('hidden');
  if(noteId) $(noteId).textContent=items.length+' 条结果';
  renderFilteredResults();
  $('dl-json').disabled=false; $('dl-csv').disabled=false;
  $('dl-json-pl').disabled=false; $('dl-csv-pl').disabled=false;
}
function renderFilteredResults(){
  const areaId=_currentAreaId, noteId=_currentNoteId;
  const totalPages=Math.ceil(_filteredItems.length/pageSize)||1;
  if(currentPage>=totalPages) currentPage=Math.max(0,totalPages-1);
  const pageItems=_filteredItems.slice(currentPage*pageSize,(currentPage+1)*pageSize);
  const sortArrow=(k)=>sortKey===k?(sortDir==='asc'?' ▲':' ▼'):'';

  let html='<table class="result-table"><thead><tr>'+
    '<th class="col-platform sortable" onclick="setSort(\'platform\')">平台'+sortArrow('platform')+'</th>'+
    '<th class="col-title sortable" onclick="setSort(\'title\')">标题'+sortArrow('title')+'</th>'+
    '<th class="col-author sortable" onclick="setSort(\'author\')">作者'+sortArrow('author')+'</th>'+
    '<th class="col-count sortable" onclick="setSort(\'plays\')">播放量'+sortArrow('plays')+'</th>'+
    '<th class="col-count sortable" onclick="setSort(\'likes\')">点赞'+sortArrow('likes')+'</th>'+
    '<th class="col-link">查看</th><th class="col-link">评论</th>'+
    '</tr></thead><tbody>';

  pageItems.forEach((it,i)=>{if(it.user!==undefined||it.content!==undefined){html+='<tr><td>'+platformTag(it.platform||'')+'</td><td colspan=3><strong>'+(it.user||it.author||'匿名')+'</strong>: '+(it.content||it.text||'').replace(/</g,'&lt;').substring(0,200)+'</td><td class=col-count>'+(it.likes||it.like_count||'')+'</td><td class=col-link>-</td><td class=col-link>-</td></tr>';return;}
    const title=String(it.title||'').replace(/</g,'&lt;');
    const author=String(it.author||'').replace(/</g,'&lt;').substring(0,20);
    const link=it.link||'';
    html+='<tr onclick="window.showDetail('+(currentPage*pageSize+i)+')" title="点击查看详情">'+
      '<td>'+platformTag(it.platform)+'</td>'+
      '<td>'+(title||'—')+'</td>'+
      '<td class="col-author">'+(author||'—')+'</td>'+
      '<td class="col-count">'+fmtCount(it.plays)+'</td>'+
      '<td class="col-count">'+fmtCount(it.likes)+'</td>'+
      '<td class="col-link">'+(link?'<a href="'+link.replace(/"/g,'&quot;')+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">查看</a>':'—')+'</td>'+
      '<td class="col-link"><button class="btn-sm" onclick="event.stopPropagation();window.loadComments('+(currentPage*pageSize+i)+')" title="加载评论">💬</button></td>'+
    '</tr>';
  });
  html+='</tbody></table>';

  html+='<div class="pagination">'+
    '<button class="btn-sm" onclick="changePage(-1)"'+(currentPage<=0?' disabled':'')+'>上一页</button>'+
    '<span>第 '+(currentPage+1)+' 页 / 共 '+totalPages+' 页 ('+_filteredItems.length+' 条)</span>'+
    '<button class="btn-sm" onclick="changePage(1)"'+(currentPage>=totalPages-1?' disabled':'')+'>下一页</button>'+
    '</div>';

  $(areaId).innerHTML=html;
}

// ═══════════ DOWNLOADS ═══════════
function downloadJSON(data, name) {
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href);
}
function downloadCSV(rows, name) {
  if(!rows||!rows.length) return;
  const headers=[...new Set(rows.flatMap(Object.keys))];
  let csv=headers.map(h=>h.includes(',')?'"'+h+'"':h).join(',')+'\n';
  rows.forEach(r=>{csv+=headers.map(h=>{const v=String(r[h]??'');return v.includes(',')?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')+'\n';});
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href);
}

loadPlatforms(); connectWs(); renderHistory();

window.loadComments = async function(idx) {
  const item = window._allItems[idx];
  if(!item) return;
  const pid = item.platform_id||item.bvid||item.aweme_id||item.photo_id||item.note_id||item.mid||item.tid||'';
  if(!pid) { alert('无有效ID，无法获取评论'); return; }
  const modal = document.getElementById('detail-modal');
  const mc = document.getElementById('modal-content');
  mc.innerHTML = '<div style="text-align:center;padding:40px">加载评论中...</div>';
  modal.classList.add('active');
  try {
    const res = await fetch('/api/crawl',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:item.platform,type:'comment',keyword:pid,limit:30})});
    const data = await res.json();
    let commentHtml = '<h3>评论 ['+data.task_id.substring(0,8)+']</h3>';
    // poll for result
    for(let i=0;i<30;i++) {
      await new Promise(r=>setTimeout(r,2000));
      const tr = await fetch('/api/crawl/'+data.task_id);
      const td = await tr.json();
      if(td.status==='done'||td.status==='error') {
        const comments = td.result||[];
        if(comments.length>0) {
          comments.forEach(c => {
            commentHtml += '<div style="border-bottom:1px solid #eee;padding:8px 0"><strong style="color:#333">'+(c.user||c.author||'匿名')+'</strong><p style="margin:4px 0;color:#555;font-size:13px">'+(c.content||c.text||'无内容')+'</p><span style="font-size:11px;color:#999">点赞 '+(c.likes||c.like_count||'0')+'</span></div>';
          });
        } else {
          commentHtml += '<p style="color:#999">暂无评论数据</p>';
        }
        mc.innerHTML = commentHtml;
        return;
      }
    }
    mc.innerHTML = '<p style="color:#999">评论加载超时</p>';
  } catch(e) {
    mc.innerHTML = '<p style="color:red">加载评论失败: '+e.message+'</p>';
  }
};
