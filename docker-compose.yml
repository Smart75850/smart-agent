version: "3.9"

services:
  smart-agent:
    build: .
    container_name: smart-agent
    ports:
      - "8000:8000"
    volumes:
      - ./output:/app/output
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - ./browser_data:/app/browser_data
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
      - BROWSER_ENGINE=playwright
    restart: unless-stopped
