name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  sanity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Install Playwright browsers
        run: |
          playwright install chromium --with-deps

      - name: Check imports
        run: |
          python -c "
          import sys, traceback
          try:
              from config.settings import Settings
              print('config.settings OK')
              from constant.platform import PlatformType, CrawlType, ErrorCode
              print('constant.platform OK')
              from proxy.proxy_manager import ProxyManager
              print('proxy.proxy_manager OK')
              from cache.memory_cache import MemoryCache
              print('cache.memory_cache OK')
              from store import get_store
              for name in ['json', 'csv', 'jsonl', 'sqlite', 'excel']:
                  get_store(name)
                  print(f'store.{name} OK')
              from base.platform_base import PlatformAdapter
              print('base.platform_base OK')
              from src.utils.browser_service import BrowserService
              print('src.utils.browser_service OK')
              from src.agents.bilibili_adapter import BilibiliAdapter
              print('src.agents.bilibili_adapter OK')
              from src.agents.xiaohongshu_adapter import XiaohongshuAdapter
              print('src.agents.xiaohongshu_adapter OK')
              from src.agents.douyin_adapter import DouyinAdapter
              print('src.agents.douyin_adapter OK')
              from src.agents.zhihu_adapter import ZhihuAdapter
              print('src.agents.zhihu_adapter OK')
              from src.agents.kuaishou_adapter import KuaishouAdapter
              print('src.agents.kuaishou_adapter OK')
              print('All imports OK')
          except Exception:
              traceback.print_exc()
              sys.exit(1)
          "

      - name: Check syntax
        run: |
          python -m py_compile main.py
          python -m py_compile api/main.py
          python -m py_compile config/settings.py
          echo "Syntax OK"

      # 基础测试 —— 82/82 必须受 CI 保护，否则任何提交都可能引入回归而 CI 照绿
      # 排除需额外重依赖(chromadb/torch/sentence-transformers/open_clip) 或真实 LLM key 的
      # memory/rerank/image-search/e2e 测试（本地配置好环境后手动跑）。
      - name: Run tests
        run: |
          python -m pytest tests/ -q \
            --ignore=tests/test_memory.py \
            --ignore=tests/test_rerank.py \
            --ignore=tests/test_image_search.py \
            --ignore=tests/test_memgpt_layers.py \
            --ignore=tests/test_e2e_integration.py \
            --ignore=tests/test_e2e_real_pipeline.py \
            --ignore=tests/test_pipeline_7_agent_real.py \
            --ignore=tests/test_awel_operators.py \
            --ignore=tests/test_video_cloner_memory.py

      - name: CLI help
        run: |
          python main.py --help
